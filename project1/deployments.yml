kind: Deployment
apiVersion: apps/v1

metadata:
  name: project1-deployment
  namespace: project1
  labels:
    app: webapp

spec:
  replicas: 3
  selector: 
    matchLabels: 
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:
      containers:
        - name: webapp-container
          image: pranav0202/python-web-app:latest
          ports:
            - containerPort: 8080    
